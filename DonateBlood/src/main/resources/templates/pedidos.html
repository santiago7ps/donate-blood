<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos de Sangre</title>

    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
        }
        .panel-container {
            background: var(--surface);
            padding: 40px;
            border-radius: var(--radius-lg);
            text-align: center;
            width: 420px;
            max-width: 92vw;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }
        .panel-container h1 {
            margin: 0 0 6px;
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
        }
        .panel-container p.subt {
            margin: 0 0 22px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .panel-container form {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }
        .panel-container select,
        .panel-container input {
            width: 100%;
            padding: 12px 14px;
            margin: 6px 0 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14.5px;
        }
        .panel-container select:focus,
        .panel-container input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-soft);
        }
        .panel-container button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(217, 4, 41, 0.25);
            transition: transform 0.18s ease;
        }
        .panel-container button:hover {
            transform: translateY(-2px);
        }
</style>
</head>
<body>

<div class="panel-container">
    <h1>🩸 Realizar Pedido de Sangre</h1>
    <p class="subt">Solicita unidades al banco de sangre</p>

    <p class="error" th:if="${error}" th:text="${error}"></p>
    <p class="success" th:if="${exito}" th:text="${exito}"></p>

    <form action="/banco/pedidos" method="POST">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label>Tipo de sangre</label>
        <select name="tipo" required>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
        </select>

        <label>Cantidad a pedir</label>
        <input type="number" name="cantidad" min="1" required>

        <button type="submit">Realizar Pedido</button>

    </form>
    <br>
    <a href="/centro/panel" class="btn-primary">Cancelar</a>
</div>

</body>
</html>
