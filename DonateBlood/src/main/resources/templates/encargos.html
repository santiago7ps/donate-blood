<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Encargar Sangre</title>

<link rel="stylesheet" href="/css/sidebar.css">
</head>

<body>

<div class="sidebar">

    <h2>CENTRO</h2>

    <div class="menu">

        <a href="/centro/unidades">🩸 Unidades disponibles</a>
        <a href="/centro/encargos" class="activo">📦 Realizar encargos</a>

        <a href="/" class="salir">🚪 Salir</a>

    </div>

</div>

<div class="contenido">

    <h1>Realizar Encargo</h1>

    <p th:if="${error}" th:text="${error}" class="error"></p>
    <p th:if="${exito}" th:text="${exito}" class="success"></p>

    <form action="/centro/encargos" method="POST">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label>Tipo de sangre</label>
        <select name="tipo" required>

            <option value="">Seleccione tipo:</option>

            <option value="A+">A+</option>
            <option value="A-">A-</option>

            <option value="B+">B+</option>
            <option value="B-">B-</option>

            <option value="O+">O+</option>
            <option value="O-">O-</option>

            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>

        </select>

        <br><br>

        <label>Cantidad</label>
        <input type="number" name="cantidad" min="1" required>

        <br><br>

        <button type="submit">Enviar</button>

    </form>

</div>

</body>
</html>
