<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/css/sidebar.css">
</head>
<body>

<div class="sidebar">
<h2>ADMIN</h2>
<div class="menu">
<a href="/admin/unidades">🩸 Unidades</a>
<a href="/admin/modificar">✏️ Modificar</a>
<a href="/admin/pedidos" class="activo">📦 Pedidos</a>
<a href="/admin/misCitas">📅 Citas</a>
<a href="/admin/agendar">➕ Agendar</a>
<a href="/" class="salir">🚪 Salir</a>
</div>
</div>

<div class="contenido">

<h1>Pedidos</h1>

<p th:if="${mensaje}" th:text="${mensaje}" class="success"></p>
<p th:if="${error}" th:text="${error}" class="error"></p>

<form action="/banco/pedidos" method="POST">

<input type="hidden" name="origen" value="admin">

<input type="hidden"
th:name="${_csrf.parameterName}"
th:value="${_csrf.token}" />

<label>Tipo de sangre:</label>

<select name="tipo" required>
    <option value="" disabled selected>Seleccione tipo:</option>
    <option value="A+">A+</option>
    <option value="A-">A-</option>
    <option value="B+">B+</option>
    <option value="B-">B-</option>
    <option value="O+">O+</option>
    <option value="O-">O-</option>
    <option value="AB+">AB+</option>
    <option value="AB-">AB-</option>
</select>

<br><br>

<label>Cantidad:</label>

<input type="number" name="cantidad" min="1" required>

<br><br>

<button type="submit">Enviar</button>

</form>

</div>

</body>
</html>
