<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="/css/sidebar.css">

</head>
<body>

<div class="sidebar">
<h2>ADMIN</h2>
<div class="menu">
<a href="/admin/unidades">🩸 Unidades</a>
<a href="/admin/modificar">✏️ Modificar</a>
<a href="/admin/pedidos">📦 Pedidos</a>
<a href="/admin/misCitas">📅 Citas</a>
<a href="/admin/agendar" class="activo">➕ Agendar</a>
<a href="/" class="salir">🚪 Salir</a>
</div>
</div>

<div class="contenido">

<h1>Agendar Cita</h1>

<div th:if="${param.error == 'hora-invalida'}" class="error">Hora inválida. Debe estar entre 08:00 y 16:30 en franjas de 30 min (sin horario de almuerzo 12:00-14:00).</div>

<form action="/admin/agendarCita" method="POST" th:object="${cita}">

<input type="hidden"
th:name="${_csrf.parameterName}"
th:value="${_csrf.token}" />

<input type="text" th:field="*{nombre}" placeholder="Nombre" required>

<input type="date" th:field="*{fecha}" required>

<input type="time" th:field="*{hora}" required>

<select th:field="*{lugar}" required>
    <option value="">Seleccione un banco de sangre</option>

    <option value="Banco de Sangre Hemocaribe">
        Banco de Sangre Hemocaribe
    </option>

    <option value="Banco de Sangre Angela Mejia Dizeo">
        Banco de Sangre Ángela Mejía Dizeo Ltda
    </option>

    <option value="Nuevo Hospital Bocagrande">
        Nuevo Hospital Bocagrande - Banco de Sangre
    </option>

    <option value="Cruz Roja Colombiana">
        Cruz Roja Colombiana Seccional Bolívar
    </option>
</select>

<select th:field="*{tipoSangre}" required>
    <option value="">Seleccione tipo de sangre</option>
    <option value="A+">A+</option>
    <option value="A-">A-</option>
    <option value="B+">B+</option>
    <option value="B-">B-</option>
    <option value="O+">O+</option>
    <option value="O-">O-</option>
    <option value="AB+">AB+</option>
    <option value="AB-">AB-</option>
</select>

<button type="submit">Guardar</button>

</form>

</div>

</body>
</html>
