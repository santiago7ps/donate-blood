<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Agendar Cita</title>

<link rel="stylesheet" href="/css/sidebar.css">
</head>

<body>

<div class="sidebar">
    <h2>DONANTE</h2>

    <div class="menu">
        <a href="/agendarCita" class="activo">📅 Agendar cita</a>
        <a href="/verCitas">🩸 Mis citas</a>
        <a href="/perfilDonante">👤 Mi perfil</a>
        <a href="/" class="salir">🚪 Salir</a>
    </div>
</div>

<div class="contenido">

    <h1>Agendar Cita</h1>

    <div th:if="${param.error == 'hora-invalida'}" class="error">Hora inválida. Seleccione una franja disponible.</div>

    <form action="/agendarCita" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <input type="text" name="nombre" placeholder="Nombre" required>

        <input type="date" name="fecha" required>

        <select name="hora" required>
            <option value="">Seleccione franja horaria</option>
            <option value="08:00">08:00 - 08:30</option>
            <option value="08:30">08:30 - 09:00</option>
            <option value="09:00">09:00 - 09:30</option>
            <option value="09:30">09:30 - 10:00</option>
            <option value="10:00">10:00 - 10:30</option>
            <option value="10:30">10:30 - 11:00</option>
            <option value="11:00">11:00 - 11:30</option>
            <option value="11:30">11:30 - 12:00</option>

            <option value="14:00">14:00 - 14:30</option>
            <option value="14:30">14:30 - 15:00</option>
            <option value="15:00">15:00 - 15:30</option>
            <option value="15:30">15:30 - 16:00</option>
            <option value="16:00">16:00 - 16:30</option>
            <option value="16:30">16:30 - 17:00</option>
        </select>

        <select name="lugar" required>
            <option value="">Seleccione banco</option>
            <option th:if="${#lists.isEmpty(bancos)}" disabled>No hay bancos registrados</option>
            <option th:each="banco : ${bancos}"
                    th:value="${banco.nombre != null and banco.nombre != '' ? banco.nombre : banco.username}"
                    th:text="${banco.nombre != null and banco.nombre != '' ? banco.nombre : banco.username}">
            </option>
        </select>

        <select name="tipoSangre" required>
            <option value="">Seleccione tipo de sangre</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <button type="submit">Agendar</button>

    </form>

</div>

</body>
</html>
