<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Editar Cita</title>

<link rel="stylesheet" href="/css/sidebar.css">
</head>

<body>

<div class="sidebar">
    <h2>DONANTE</h2>

    <div class="menu">
        <a href="/agendarCita">📅 Agendar cita</a>
        <a href="/verCitas" class="activo">🩸 Mis citas</a>
        <a href="/perfilDonante">👤 Mi perfil</a>
        <a href="/" class="salir">🚪 Salir</a>
    </div>
</div>

<div class="contenido">

<h2>Editar Cita</h2>

<div th:if="${param.error == 'hora-invalida'}" class="error">Hora inválida. Seleccione una franja disponible.</div>

<form th:action="@{/actualizarCita}" method="post" th:object="${cita}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <input type="hidden" th:field="*{id}" />

    <input type="text" th:field="*{nombre}" required>

    <input type="date" th:field="*{fecha}" required>

    <input type="time" th:field="*{hora}" required>

    <select th:field="*{lugar}">
        <option th:if="${#lists.isEmpty(bancos)}" disabled>No hay bancos registrados</option>
        <option th:each="banco : ${bancos}"
                th:value="${banco.nombre != null and banco.nombre != '' ? banco.nombre : banco.username}"
                th:text="${banco.nombre != null and banco.nombre != '' ? banco.nombre : banco.username}">
        </option>
    </select>

    <select th:field="*{tipoSangre}">
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
    </select>

    <button type="submit">Actualizar</button>

</form>

</div>

</body>
</html>
