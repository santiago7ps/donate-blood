<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bancos de sangre cercanos</title>

<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">

<style>
    .buscador {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
    }
    .buscador input {
        flex: 1;
        min-width: 220px;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 15px;
    }
    .buscador button {
        padding: 10px 18px;
        border: none;
        border-radius: 10px;
        background: #c62828;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
    }
    .buscador button.secundario {
        background: #1565c0;
    }
    #estado {
        margin: 0 0 12px;
        font-size: 14px;
        color: #555;
        min-height: 20px;
    }

    /* Panel de la ruta */
    #rutaPanel {
        display: none;
        background: #fff;
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    #rutaPanel .titulo {
        font-weight: 700;
        margin-bottom: 6px;
    }
    #rutaPanel .resumen {
        font-size: 15px;
        color: #1565c0;
        font-weight: 700;
        margin: 6px 0 10px;
    }
    #rutaPanel .modos {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
    }
    #rutaPanel .modos button {
        padding: 7px 14px;
        border-radius: 20px;
        border: 1px solid #1565c0;
        background: #fff;
        color: #1565c0;
        font-weight: 600;
        cursor: pointer;
    }
    #rutaPanel .modos button.activo {
        background: #1565c0;
        color: #fff;
    }
    #rutaPanel .modos button.guia {
        border-color: #2e7d32;
        background: #2e7d32;
        color: #fff;
    }
    #rutaPanel .modos button.guia.encendida {
        border-color: #c62828;
        background: #c62828;
    }
    #rutaPanel .modos button.quitar {
        border-color: #999;
        color: #555;
        margin-left: auto;
    }

    #mapa {
        height: 460px;
        width: 100%;
        border-radius: 14px;
        z-index: 0;
    }
    .btn-ruta {
        margin-top: 8px;
        padding: 7px 12px;
        border: none;
        border-radius: 8px;
        background: #1565c0;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
    }
    #lista {
        margin-top: 22px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 14px;
    }
    .banco-item {
        background: #fff;
        border-radius: 12px;
        padding: 14px 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        cursor: pointer;
    }
    .banco-item h3 {
        margin: 0 0 6px;
        font-size: 16px;
    }
    .banco-item p {
        margin: 2px 0;
        font-size: 14px;
        color: #444;
    }
    .banco-item .distancia {
        color: #c62828;
        font-weight: 700;
    }
</style>
</head>

<body>

<div class="sidebar">
    <h2>DONANTE</h2>

    <div class="menu">
        <a href="/agendarCita">📅 Agendar cita</a>
        <a href="/verCitas">🩸 Mis citas</a>
        <a href="/mapaBancos" class="activo">🗺️ Bancos cercanos</a>
        <a href="/perfilDonante">👤 Mi perfil</a>
        <a href="/logout" class="salir">🚪 Salir</a>
    </div>
</div>

<div class="contenido">

    <h1>Bancos de sangre cercanos</h1>
    <p>Encuentra dónde donar en Cartagena. Toca un marcador para ver el nombre, la dirección y el teléfono, y pulsa "Cómo llegar" para ver la ruta.</p>

    <form class="buscador" id="formBuscar">
        <input type="text" id="busqueda" autocomplete="off" placeholder="Busca un banco de sangre o un barrio (ej. Hemocaribe, Bocagrande)">
        <button type="submit">Buscar</button>
        <button type="button" class="secundario" id="btnUbicacion">📍 Mi ubicación</button>
    </form>

    <div id="estado"></div>

    <div id="rutaPanel">
        <div class="titulo" id="rutaTitulo"></div>
        <div class="modos">
            <button type="button" data-modo="car" class="activo">🚗 Carro</button>
            <button type="button" data-modo="foot">🚶 A pie</button>
            <button type="button" data-modo="bike">🚲 Bicicleta</button>
            <button type="button" class="guia" id="btnGuia">▶ Iniciar guía</button>
            <button type="button" class="quitar" id="btnQuitarRuta">✖ Quitar ruta</button>
        </div>
        <div class="resumen" id="rutaResumen"></div>
    </div>

    <div id="mapa"></div>
    <div id="lista"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
    var CARTAGENA = [10.3910, -75.4794];

    // Límites de navegación: amplios para poder moverse por todas las puntas sin que el mapa rebote
    var LIMITES = L.latLngBounds( L.latLng(9.90, -76.10), L.latLng(10.80, -75.00) );

    var mapa = L.map('mapa', {
        minZoom: 9,
        maxBounds: LIMITES,
        maxBoundsViscosity: 0.2
    }).setView(CARTAGENA, 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(mapa);

    var bancos = [];
    var marcadores = [];
    var marcadorUsuario = null;
    var origen = null;
    var visibles = null; // null = todos; si no, arreglo de índices que coinciden con la búsqueda

    // Estado de la ruta y de la guía en tiempo real
    var capaRuta = null;
    var bancoRuta = null;
    var modoRuta = 'car';
    var contadorRuta = 0;
    var idSeguimiento = null;      // id del watchPosition (null = guía apagada)
    var ultimoCalculo = 0;         // hora del último cálculo de ruta
    var origenUltimoCalculo = null;
    var INTERVALO_MS = 8000;       // mínimo entre recálculos de ruta
    var MOVIMIENTO_MIN_KM = 0.015; // 15 metros
    var LLEGADA_KM = 0.04;         // 40 metros

    function escapar(texto) {
        var d = document.createElement('div');
        d.textContent = texto == null ? '' : texto;
        return d.innerHTML;
    }

    function estado(mensaje) {
        document.getElementById('estado').textContent = mensaje;
    }

    // Distancia en km entre dos puntos (fórmula de Haversine)
    function distanciaKm(lat1, lon1, lat2, lon2) {
        var R = 6371;
        var rad = Math.PI / 180;
        var dLat = (lat2 - lat1) * rad;
        var dLon = (lon2 - lon1) * rad;
        var a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
              + Math.cos(lat1 * rad) * Math.cos(lat2 * rad)
              * Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // ---------- Resaltar Cartagena ----------

    // Contorno aproximado de Cartagena (se usa solo si no se puede descargar el real)
    var CONTORNO_APROX = [
        [10.4650, -75.4700], [10.4600, -75.4250], [10.3900, -75.4100],
        [10.3350, -75.4200], [10.3200, -75.4800], [10.3350, -75.5250],
        [10.3800, -75.5700], [10.4100, -75.5700], [10.4500, -75.5300]
    ];
    var MUNDO = [ [85, -180], [85, 180], [-85, 180], [-85, -180] ];

    // Zona que se resalta: ciudad continental, Tierra Bomba y Barú.
    // (Las islas lejanas del distrito, como Rosario o San Bernardo, se dejan por fuera.)
    var ZONA = { latMin: 10.10, latMax: 10.60, lngMin: -75.65, lngMax: -75.30 };

    function aLatLng(anillo) {
        return anillo.map(function (p) { return [p[1], p[0]]; });
    }

    // Centro aproximado de un anillo [lng, lat]
    function centroDe(anillo) {
        var sLat = 0, sLng = 0;
        anillo.forEach(function (p) { sLng += p[0]; sLat += p[1]; });
        return { lat: sLat / anillo.length, lng: sLng / anillo.length };
    }

    function enZona(anillo) {
        var c = centroDe(anillo);
        return c.lat >= ZONA.latMin && c.lat <= ZONA.latMax
            && c.lng >= ZONA.lngMin && c.lng <= ZONA.lngMax;
    }

    // Pinta de gris lo que NO es Cartagena y dibuja el borde de la ciudad
    function resaltarCartagena(anillos) {
        L.polygon([MUNDO].concat(anillos), {
            stroke: false,
            fillColor: '#37474f',
            fillOpacity: 0.35,
            interactive: false
        }).addTo(mapa);

        anillos.forEach(function (anillo) {
            L.polygon(anillo, {
                color: '#c62828',
                weight: 3,
                fillColor: '#c62828',
                fillOpacity: 0.05,
                interactive: false
            }).addTo(mapa);
        });
    }

    function cargarContornoCartagena() {
        fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&polygon_geojson=1&polygon_threshold=0.0003&countrycodes=co&q='
              + encodeURIComponent('Cartagena de Indias, Bolívar, Colombia'))
            .then(function (r) { return r.json(); })
            .then(function (res) {
                var geo = res.length ? res[0].geojson : null;
                var piezas = [];
                if (geo && geo.type === 'Polygon') {
                    piezas.push(geo.coordinates[0]);
                } else if (geo && geo.type === 'MultiPolygon') {
                    geo.coordinates.forEach(function (poligono) {
                        piezas.push(poligono[0]);
                    });
                }
                // Solo las piezas que están en la zona de interés
                var anillos = piezas.filter(enZona).map(aLatLng);
                if (!anillos.length) { throw new Error('sin contorno'); }
                resaltarCartagena(anillos);
            })
            .catch(function () {
                resaltarCartagena([CONTORNO_APROX]);
            });
    }

    // ---------- Marcadores y lista ----------

    function textoPopup(b, indice) {
        return '<strong>' + escapar(b.nombre) + '</strong><br>'
             + escapar(b.direccion) + '<br>'
             + 'Tel: ' + escapar(b.telefono) + '<br>'
             + '<button type="button" class="btn-ruta" onclick="trazarRuta(' + indice + ')">🧭 Cómo llegar</button>';
    }

    function dibujarMarcadores() {
        bancos.forEach(function (b, i) {
            var m = L.marker([b.latitud, b.longitud]).addTo(mapa);
            m.bindPopup(textoPopup(b, i));
            marcadores.push(m);
        });
    }

    function dibujarLista() {
        var lista = document.getElementById('lista');
        lista.innerHTML = '';

        var items = bancos.map(function (b, i) {
            var km = origen ? distanciaKm(origen[0], origen[1], b.latitud, b.longitud) : null;
            return { banco: b, indice: i, km: km };
        }).filter(function (it) {
            return visibles === null || visibles.indexOf(it.indice) !== -1;
        });

        if (origen) {
            items.sort(function (a, b) { return a.km - b.km; });
        }

        items.forEach(function (it) {
            var div = document.createElement('div');
            div.className = 'banco-item';
            div.innerHTML = '<h3>' + escapar(it.banco.nombre) + '</h3>'
                + '<p>' + escapar(it.banco.direccion) + '</p>'
                + '<p>Tel: ' + escapar(it.banco.telefono) + '</p>'
                + (it.km !== null
                    ? '<p class="distancia">A ' + it.km.toFixed(1) + ' km de ti</p>'
                    : '');
            div.addEventListener('click', function () {
                var m = marcadores[it.indice];
                mapa.setView(m.getLatLng(), 15);
                m.openPopup();
            });
            lista.appendChild(div);
        });
    }

    // ---------- Ubicación del usuario ----------

    // Dibuja (o mueve) el punto azul del usuario
    function ponerMarcadorUsuario(lat, lon) {
        origen = [lat, lon];
        if (marcadorUsuario) {
            marcadorUsuario.setLatLng(origen);
        } else {
            marcadorUsuario = L.circleMarker(origen, {
                radius: 9,
                color: '#1565c0',
                fillColor: '#1e88e5',
                fillOpacity: 0.9
            }).addTo(mapa).bindPopup('Tú estás aquí');
        }
    }

    function fijarOrigen(lat, lon, soloCentrar) {
        ponerMarcadorUsuario(lat, lon);

        if (soloCentrar) {
            mapa.setView(origen, 15);
        } else {
            // Encuadra el punto del usuario con el banco más cercano
            var masCercano = null;
            var menor = Infinity;
            bancos.forEach(function (b) {
                var d = distanciaKm(lat, lon, b.latitud, b.longitud);
                if (d < menor) { menor = d; masCercano = b; }
            });
            if (masCercano) {
                mapa.fitBounds([origen, [masCercano.latitud, masCercano.longitud]], { padding: [60, 60] });
            } else {
                mapa.setView(origen, 14);
            }
        }

        dibujarLista();
    }

    function pedirUbicacion(soloCentrar, despues) {
        if (!navigator.geolocation) {
            estado('Tu navegador no permite la ubicación. Mostramos Cartagena; puedes buscar un banco o un barrio arriba.');
            return;
        }
        estado('Buscando tu ubicación...');
        navigator.geolocation.getCurrentPosition(
            function (pos) {
                estado('Mostrando los bancos más cercanos a tu ubicación.');
                fijarOrigen(pos.coords.latitude, pos.coords.longitude, soloCentrar);
                if (despues) { despues(); }
            },
            function () {
                estado('No pudimos acceder a tu ubicación. Mostramos Cartagena; puedes buscar un banco o un barrio arriba.');
            },
            { timeout: 10000 }
        );
    }

    document.getElementById('btnUbicacion').addEventListener('click', function () {
        pedirUbicacion(true);
    });

    // ---------- Ruta "Cómo llegar" ----------

    var SERVIDORES = {
        car:  'https://routing.openstreetmap.de/routed-car/route/v1/driving/',
        foot: 'https://routing.openstreetmap.de/routed-foot/route/v1/driving/',
        bike: 'https://routing.openstreetmap.de/routed-bike/route/v1/driving/'
    };
    var NOMBRE_MODO = { car: 'en carro', foot: 'a pie', bike: 'en bicicleta' };

    function formatoTiempo(segundos) {
        var min = Math.round(segundos / 60);
        if (min < 1) { return 'menos de 1 min'; }
        if (min < 60) { return min + ' min'; }
        var h = Math.floor(min / 60);
        var m = min % 60;
        return h + ' h' + (m ? ' ' + m + ' min' : '');
    }

    function quitarRuta() {
        detenerGuia();
        contadorRuta++;
        if (capaRuta) {
            mapa.removeLayer(capaRuta);
            capaRuta = null;
        }
        bancoRuta = null;
        document.getElementById('rutaPanel').style.display = 'none';
    }

    function marcarModo() {
        var botones = document.querySelectorAll('#rutaPanel .modos button[data-modo]');
        for (var i = 0; i < botones.length; i++) {
            botones[i].classList.toggle('activo', botones[i].getAttribute('data-modo') === modoRuta);
        }
    }

    // ajustarVista = true: encuadra toda la ruta. En la guía en vivo se manda false
    // para que el mapa siga al usuario en lugar de saltar.
    function calcularRuta(ajustarVista) {
        if (bancoRuta === null || !origen) { return; }
        var b = bancos[bancoRuta];
        var miRuta = ++contadorRuta;
        ultimoCalculo = Date.now();
        origenUltimoCalculo = [origen[0], origen[1]];

        document.getElementById('rutaPanel').style.display = 'block';
        document.getElementById('rutaTitulo').textContent = 'Ruta hacia ' + b.nombre;
        if (!capaRuta) {
            document.getElementById('rutaResumen').textContent = 'Calculando ruta...';
        }
        marcarModo();

        var url = SERVIDORES[modoRuta]
            + origen[1] + ',' + origen[0] + ';' + b.longitud + ',' + b.latitud
            + '?overview=full&geometries=geojson';

        fetch(url)
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (miRuta !== contadorRuta) { return; } // llegó tarde: ya hay otra ruta
                if (!data.routes || !data.routes.length) { throw new Error('sin ruta'); }

                var ruta = data.routes[0];
                if (capaRuta) { mapa.removeLayer(capaRuta); }
                capaRuta = L.geoJSON(ruta.geometry, {
                    style: { color: '#1565c0', weight: 6, opacity: 0.85 }
                }).addTo(mapa);
                if (ajustarVista) {
                    mapa.fitBounds(capaRuta.getBounds(), { padding: [50, 50] });
                }

                document.getElementById('rutaResumen').textContent =
                    (idSeguimiento !== null ? 'Te faltan ' : '')
                    + (ruta.distance / 1000).toFixed(1) + ' km · ' + formatoTiempo(ruta.duration)
                    + ' ' + NOMBRE_MODO[modoRuta];
            })
            .catch(function () {
                if (miRuta !== contadorRuta) { return; }
                document.getElementById('rutaResumen').textContent =
                    'No pudimos calcular la ruta en este momento. Intenta de nuevo.';
            });
    }

    // Se llama desde el botón "Cómo llegar" de cada marcador
    function trazarRuta(indice) {
        detenerGuia();
        bancoRuta = indice;
        if (origen) {
            calcularRuta(true);
        } else {
            estado('Necesitamos tu ubicación para trazar la ruta. Acepta el permiso del navegador.');
            pedirUbicacion(false, function () { calcularRuta(true); });
        }
    }
    window.trazarRuta = trazarRuta;

    document.querySelectorAll('#rutaPanel .modos button[data-modo]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            modoRuta = btn.getAttribute('data-modo');
            calcularRuta(idSeguimiento === null);
        });
    });
    document.getElementById('btnQuitarRuta').addEventListener('click', quitarRuta);

    // ---------- Guía en tiempo real ----------

    function detenerGuia() {
        if (idSeguimiento !== null) {
            navigator.geolocation.clearWatch(idSeguimiento);
            idSeguimiento = null;
        }
        var btn = document.getElementById('btnGuia');
        btn.textContent = '▶ Iniciar guía';
        btn.classList.remove('encendida');
    }

    function alMoverse(pos) {
        var lat = pos.coords.latitude;
        var lon = pos.coords.longitude;
        ponerMarcadorUsuario(lat, lon);
        mapa.panTo(origen);

        if (bancoRuta === null) { return; }
        var b = bancos[bancoRuta];

        // ¿Ya llegó?
        if (distanciaKm(lat, lon, b.latitud, b.longitud) <= LLEGADA_KM) {
            detenerGuia();
            document.getElementById('rutaResumen').textContent = '🎉 ¡Llegaste a ' + b.nombre + '!';
            estado('Llegaste a tu destino.');
            return;
        }

        // Recalcula la ruta si pasó el tiempo mínimo y se movió lo suficiente
        var pasoTiempo = Date.now() - ultimoCalculo >= INTERVALO_MS;
        var seMovio = !origenUltimoCalculo
            || distanciaKm(lat, lon, origenUltimoCalculo[0], origenUltimoCalculo[1]) >= MOVIMIENTO_MIN_KM;
        if (pasoTiempo && seMovio) {
            calcularRuta(false);
        }
    }

    function iniciarGuia() {
        if (!navigator.geolocation) {
            estado('Tu navegador no permite seguir tu ubicación.');
            return;
        }
        if (bancoRuta === null) {
            estado('Primero elige un banco con "Cómo llegar".');
            return;
        }
        idSeguimiento = navigator.geolocation.watchPosition(
            alMoverse,
            function () {
                estado('No pudimos seguir tu ubicación. Revisa el permiso de ubicación del navegador.');
                detenerGuia();
            },
            { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
        );
        var btn = document.getElementById('btnGuia');
        btn.textContent = '⏹ Detener guía';
        btn.classList.add('encendida');
        estado('Guía activada: el mapa te sigue mientras te mueves.');
        if (origen) { mapa.setView(origen, 17); }
        calcularRuta(false);
    }

    document.getElementById('btnGuia').addEventListener('click', function () {
        if (idSeguimiento === null) { iniciarGuia(); } else { detenerGuia(); estado('Guía detenida.'); }
    });

    // ---------- Buscador: solo bancos de sangre ----------

    // Quita tildes y pasa a minúsculas para comparar ("Bolivar" = "Bolívar")
    function normalizar(t) {
        return (t || '').toString().toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    // Busca solo entre los bancos de sangre: por nombre, dirección o barrio
    function buscarBancos(mostrarMensajes) {
        var q = normalizar(document.getElementById('busqueda').value.trim());

        if (!q) {
            visibles = null;
            marcadores.forEach(function (m) { if (!mapa.hasLayer(m)) { m.addTo(mapa); } });
            dibujarLista();
            if (mostrarMensajes) { estado('Escribe el nombre de un banco o un barrio para buscar.'); }
            return;
        }

        var palabras = q.split(/\s+/);
        visibles = [];
        bancos.forEach(function (b, i) {
            var texto = normalizar(b.nombre + ' ' + b.direccion);
            var coincide = palabras.every(function (p) { return texto.indexOf(p) !== -1; });
            if (coincide) { visibles.push(i); }
        });

        marcadores.forEach(function (m, i) {
            if (visibles.indexOf(i) !== -1) {
                if (!mapa.hasLayer(m)) { m.addTo(mapa); }
            } else if (mapa.hasLayer(m)) {
                mapa.removeLayer(m);
            }
        });
        dibujarLista();

        if (!visibles.length) {
            estado('No encontramos bancos con ese nombre o barrio. Prueba con otro nombre (ej. Hemocaribe) o barrio (ej. Bocagrande).');
            return;
        }

        estado(visibles.length === 1
            ? 'Encontramos 1 banco de sangre.'
            : 'Encontramos ' + visibles.length + ' bancos de sangre.');

        if (visibles.length === 1) {
            var m = marcadores[visibles[0]];
            mapa.setView(m.getLatLng(), 15);
            m.openPopup();
        } else {
            mapa.fitBounds(visibles.map(function (i) {
                return [bancos[i].latitud, bancos[i].longitud];
            }), { padding: [60, 60] });
        }
    }

    document.getElementById('formBuscar').addEventListener('submit', function (e) {
        e.preventDefault();
        buscarBancos(true);
    });

    // Filtra mientras se escribe
    document.getElementById('busqueda').addEventListener('input', function () {
        buscarBancos(false);
    });

    // ---------- Arranque ----------

    cargarContornoCartagena();

    fetch('/api/bancos')
        .then(function (r) { return r.json(); })
        .then(function (data) {
            bancos = data;
            dibujarMarcadores();
            dibujarLista();
            pedirUbicacion(false);
        })
        .catch(function () {
            estado('No se pudieron cargar los bancos de sangre.');
        });
</script>

</body>
</html>
