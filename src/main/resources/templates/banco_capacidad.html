<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capacidad de atención</title>

<link rel="stylesheet" href="/css/sidebar.css">
</head>
<body>

<div class="sidebar">
    <h2>BANCO</h2>

    <div class="menu">
        <a href="/banco/unidades">🩸 Unidades disponibles</a>
        <a href="/banco/modificar">✏️ Modificar unidades</a>
        <a href="/banco/citas">📅 Ver citas</a>
        <a href="/banco/capacidad" class="activo">👩‍⚕️ Capacidad de atención</a>
        <a href="/banco/prediccion">📈 Predicción de asistencia</a>
        <a href="/logout" class="salir">🚪 Salir</a>
    </div>
</div>

<div class="contenido">

<h1>Capacidad de atención</h1>

<p>Número de médicos o cuartos disponibles. Es la cantidad máxima de donantes que pueden
   agendar la misma fecha y hora en tu banco.</p>

<p th:if="${mensaje}" th:text="${mensaje}" class="success"></p>
<p th:if="${error}" th:text="${error}" class="error"></p>

<form action="/banco/capacidad" method="POST" class="form-angosto">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

<label for="capacidad">Donantes por hora:</label><br>
<input type="number" id="capacidad" name="capacidad" min="1" th:max="${maxima}" step="1"
       th:value="${capacidad}" required>

<button type="submit">Guardar</button>
</form>

</div>

</body>
</html>
